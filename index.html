<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Frontend Mentor | Product preview card component</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet">

    <link rel="icon" type="image/png" sizes="32x32"
      href="./images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">

  </head>
  <body>

    <main class="product-page">
      <article class="product-card">

        <figure class="card-image">
          <picture>
            <source media="(max-width: 600px)" srcset="image-product-mobile.jpg">
            <img src="image-product-desktop.jpg" alt="Gabrielle Essence Eau De Parfum bottle">
          </picture>
        </figure>

        <section class="card-content">
          <p class="category">Perfume</p>
          <h1>Gabrielle Essence Eau De Parfum</h1>
          <p class="description">A floral, solar and voluptuous interpretation
            composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.</p>
          <div class="price">
            <p class="current-price">$149.99</p>
            <p class="old-price"><s>$169.99</s></p>
          </div>
          <button type="button"><img src="icon-cart.svg" alt="">Add to
            Cart</button>
        </section>

      </article>
    </main>
  </body>
</html>
